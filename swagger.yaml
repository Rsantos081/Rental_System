openapi: 3.0.3
info:
  title: Rental System API
  description: |
    API REST para gerenciamento de uma agência de aluguel de veículos.

    A API possui recursos para marcas, veículos do inventário, clientes,
    pagamentos e locações.

    As rotas protegidas utilizam a sessão do Flask-Login (cookie `session`),
    criada em `POST /auth/login`. O `POST /auth/registro` também exige login,
    então o primeiro administrador deve ser criado diretamente no banco.
    Valores monetários (`Decimal`) e datas são serializados pelo Flask como texto:
    `"500.00"` e `"Thu, 08 Oct 2026 00:00:00 GMT"`.
  version: 1.0.0
  contact:
    name: Rental System

servers:
- url: http://127.0.0.1:5000
  description: Servidor local

tags:
- name: Autenticação
  description: Registro, login e logout de administradores
- name: Marcas
  description: Gerenciamento das marcas dos veículos
- name: Inventário
  description: Gerenciamento dos veículos disponíveis no inventário
- name: Clientes
  description: Gerenciamento dos clientes
- name: Pagamentos
  description: Gerenciamento dos pagamentos
- name: Locações
  description: Gerenciamento das locações e seus status

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: Sessão criada pelo Flask-Login.
  schemas:
    Mensagem:
      type: object
      properties:
        mensagem:
          type: string
          example: Operação realizada com sucesso
    MarcaInput:
      type: object
      required:
      - nome_marcas
      - origem
      properties:
        nome_marcas:
          type: string
          example: Toyota
        origem:
          type: string
          example: Japão
    Marca:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome_marcas:
          type: string
          example: Toyota
        origem:
          type: string
          example: Japão
    VeiculoInput:
      type: object
      required:
      - modelo
      - transmissao
      - motor
      - combustivel
      - marcas_id
      - valor_diaria
      properties:
        modelo:
          type: string
          example: Corolla
        transmissao:
          type: string
          example: Automática
        motor:
          type: string
          example: '2.0'
        combustivel:
          type: string
          example: Flex
        marcas_id:
          type: integer
          example: 1
        valor_diaria:
          type: number
          format: double
          minimum: 0.01
          example: 150.0
          description: Valor da diária de locação do veículo (maior que zero)
    Veiculo:
      type: object
      properties:
        id:
          type: integer
          example: 1
        modelo:
          type: string
          example: Corolla
        transmissao:
          type: string
          example: Automática
        motor:
          type: string
          example: '2.0'
        combustivel:
          type: string
          example: Flex
        valor_diaria:
          type: string
          example: '150.00'
          description: Decimal serializado como texto pelo Flask
        marcas_id:
          type: integer
          example: 1
    ClienteInput:
      type: object
      required:
      - nome_cliente
      - sobrenome_cliente
      - endereco
      - cpf
      properties:
        nome_cliente:
          type: string
          example: Ruan
        sobrenome_cliente:
          type: string
          example: Santos
        endereco:
          type: string
          example: Rua Exemplo, 100
        cpf:
          type: string
          example: '12345678900'
    Cliente:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome_cliente:
          type: string
          example: Ruan
        sobrenome_cliente:
          type: string
          example: Santos
        endereco:
          type: string
          example: Rua Exemplo, 100
        cpf:
          type: string
          example: '12345678900'
    PagamentoInput:
      type: object
      required:
      - valor_pago
      - data_pagamentos
      - locacao_id
      properties:
        valor_pago:
          type: number
          format: double
          example: 500.0
        data_pagamentos:
          type: string
          format: date
          example: '2026-10-08'
        locacao_id:
          type: integer
          example: 1
    Pagamento:
      type: object
      properties:
        id:
          type: integer
          example: 1
        valor_pago:
          type: string
          example: '500.00'
          description: Decimal serializado como texto pelo Flask
        data_pagamentos:
          type: string
          example: Thu, 08 Oct 2026 00:00:00 GMT
          description: Data serializada pelo Flask no formato RFC 822
        locacao_id:
          type: integer
          example: 1
    LocacaoInput:
      type: object
      required:
      - data_inicio
      - data_prevista_devolucao
      - inventario_id
      - clientes_id
      properties:
        data_inicio:
          type: string
          format: date
          example: '2026-10-08'
        data_prevista_devolucao:
          type: string
          format: date
          example: '2026-10-15'
        inventario_id:
          type: integer
          example: 1
        clientes_id:
          type: integer
          example: 1
      description: |
        O status e o valor não são enviados na criação.
        O serviço cria a locação com status ATIVA e calcula o valor:
        número de dias (devolução prevista - início) x valor da diária do veículo.
        Se `valor` for enviado no corpo, ele é ignorado.
    Locacao:
      type: object
      properties:
        id:
          type: integer
          example: 1
        data_inicio:
          type: string
          example: Thu, 08 Oct 2026 00:00:00 GMT
          description: Data serializada pelo Flask no formato RFC 822
        data_prevista_devolucao:
          type: string
          example: Thu, 15 Oct 2026 00:00:00 GMT
          description: Data serializada pelo Flask no formato RFC 822
        status_locacao:
          type: string
          enum:
          - ATIVA
          - ATRASADA
          - FINALIZADA
          - CANCELADA
          example: ATIVA
        valor:
          type: string
          example: '500.00'
          description: Calculado pelo servidor (dias x diária do veículo); Decimal serializado como texto pelo Flask
        valor_pago:
          type: string
          example: '300.00'
          description: Soma dos pagamentos da locação; Decimal serializado como texto pelo Flask
        saldo:
          type: string
          example: '750.00'
          description: valor - valor_pago; Decimal serializado como texto pelo Flask
        inventario_id:
          type: integer
          example: 1
        clientes_id:
          type: integer
          example: 1
    StatusLocacaoInput:
      type: object
      required:
      - status_locacao
      properties:
        status_locacao:
          type: string
          enum:
          - ATIVA
          - ATRASADA
          - FINALIZADA
          - CANCELADA
          example: FINALIZADA
    MarcaUpdate:
      type: object
      description: Todos os campos são opcionais; apenas os enviados são atualizados.
      properties:
        nome_marcas:
          type: string
          example: Toyota
        origem:
          type: string
          example: Japão
    VeiculoUpdate:
      type: object
      description: Todos os campos são opcionais. A marca do veículo (`marcas_id`) não é alterada por este endpoint.
      properties:
        modelo:
          type: string
          example: Corolla
        transmissao:
          type: string
          example: Automática
        motor:
          type: string
          example: '2.0'
        combustivel:
          type: string
          example: Flex
        valor_diaria:
          type: number
          format: double
          minimum: 0.01
          example: 150.0
    ClienteUpdate:
      type: object
      description: Todos os campos são opcionais; apenas os enviados são atualizados.
      properties:
        nome_cliente:
          type: string
          example: Ruan
        sobrenome_cliente:
          type: string
          example: Santos
        endereco:
          type: string
          example: Rua Exemplo, 100
        cpf:
          type: string
          example: '12345678900'
    ClienteDetalhe:
      type: object
      description: Retorno da busca por ID (não inclui o campo `id`).
      properties:
        nome_cliente:
          type: string
          example: Ruan
        sobrenome_cliente:
          type: string
          example: Santos
        endereco:
          type: string
          example: Rua Exemplo, 100
        cpf:
          type: string
          example: '12345678900'
    AdminLogin:
      type: object
      required:
      - nome
      - senha
      properties:
        nome:
          type: string
          example: admin
        senha:
          type: string
          format: password
          example: minhaSenha123
    AdminRegistro:
      type: object
      required:
      - nome
      - sobrenome
      - cpf
      - senha
      properties:
        nome:
          type: string
          example: Maria
        sobrenome:
          type: string
          example: Souza
        cpf:
          type: string
          example: '12345678900'
        senha:
          type: string
          format: password
          example: minhaSenha123
          description: Armazenada como hash (nunca em texto puro)
  parameters:
    MarcasId:
      name: marcas_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
    InventarioId:
      name: inventario_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
    ClienteId:
      name: cliente_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
    ClientesId:
      name: clientes_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
    PagamentoId:
      name: pagamento_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
    LocacaoId:
      name: locacoes_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
  responses:
    NaoAutenticado:
      description: Usuário não autenticado (sessão ausente ou expirada)

paths:

  /auth/registro:
    post:
      tags:
      - Autenticação
      summary: Registrar administrador
      description: |
        Cria um administrador. Exige um administrador autenticado. A senha é guardada como hash.

        Regras:
        - `nome`, `sobrenome`, `cpf` e `senha` são obrigatórios.
        - Não pode existir administrador com o mesmo nome ou CPF.
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRegistro'
      responses:
        '201':
          description: Administrador registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Administrador registrado com sucesso
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Dados invalidos, observe os campos
        '409':
          description: Administrador já existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Administrador ja existe
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /auth/login:
    post:
      tags:
      - Autenticação
      summary: Login do administrador
      description: Valida nome e senha e cria a sessão (cookie `session`), usada nas rotas protegidas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLogin'
      responses:
        '200':
          description: Administrador autenticado (o cookie de sessão vem em Set-Cookie)
          headers:
            Set-Cookie:
              description: Cookie de sessão `session`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Administrador logado com sucesso
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Credenciais invalidas

  /auth/logout:
    post:
      tags:
      - Autenticação
      summary: Logout do administrador
      description: Encerra a sessão atual.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Logout realizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Logout realizado com sucesso
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /api/marca/add:
    post:
      tags:
      - Marcas
      summary: Cadastrar marca
      description: Cadastra uma nova marca de veículo.
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarcaInput'
            example:
              nome_marcas: Toyota
              origem: Japão
      responses:
        '201':
          description: Marca criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Marca adicionada com sucesso
        '400':
          description: Dados da marca inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Dados da marca invalidos
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /api/marca/:
    get:
      tags:
      - Marcas
      summary: Listar marcas
      description: Retorna todas as marcas cadastradas.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Lista de marcas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Marca'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /api/marca/{marcas_id}:
    get:
      tags:
      - Marcas
      summary: Buscar marca por ID
      security:
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/MarcasId'
      responses:
        '200':
          description: Marca encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Marca'
        '404':
          description: Marca não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Marca naõ encontrada
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /api/marca/upadate/{marcas_id}:
    put:
      tags:
      - Marcas
      summary: Atualizar marca
      description: Atualiza parcialmente os campos enviados da marca.
      security:
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/MarcasId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarcaUpdate'
            example:
              nome_marcas: Toyota
              origem: Japão
      responses:
        '200':
          description: Marca atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Marca atualizada com sucesso
        '404':
          description: Marca não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Marca não encontrada
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /api/marca/delete/{marcas_id}:
    delete:
      tags:
      - Marcas
      summary: Excluir marca
      security:
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/MarcasId'
      responses:
        '200':
          description: Marca excluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Marca excluida com sucesso
        '404':
          description: Marca não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Marca não encontrada
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /api/inventario/add:
    post:
      tags:
      - Inventário
      summary: Cadastrar veículo
      description: Cadastra um veículo e associa o veículo a uma marca existente.
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeiculoInput'
            example:
              modelo: Corolla
              transmissao: Automática
              motor: 2.0
              combustivel: Flex
              marcas_id: 1
              valor_diaria: 150.0
      responses:
        '201':
          description: Veículo criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Veiculo adicionado com sucesso
        '400':
          description: Dados do veículo inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              examples:
                dados_invalidos:
                  value:
                    mensagem: Dados do veiculo invalidos
                diaria_invalida:
                  value:
                    mensagem: Valor da diaria invalido
        '404':
          description: Marca informada não existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Marca não encontrada
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /api/inventario/:
    get:
      tags:
      - Inventário
      summary: Listar veículos
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Lista de veículos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Veiculo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /api/inventario/{inventario_id}:
    get:
      tags:
      - Inventário
      summary: Buscar veículo por ID
      security:
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/InventarioId'
      responses:
        '200':
          description: Veículo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Veiculo'
        '404':
          description: Veículo não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Veiculo não encontrado
        '401':
          $ref: '#/components/responses/NaoAutenticado'
    put:
      tags:
      - Inventário
      summary: Atualizar veículo
      description: Atualiza os campos enviados do veículo.
      security:
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/InventarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeiculoUpdate'
            example:
              modelo: Corolla XEi
              transmissao: Automática
              motor: '2.0'
              combustivel: Flex
              valor_diaria: 160.0
      responses:
        '200':
          description: Veículo atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Veiculo atualizado com sucesso
        '400':
          description: Valor da diária inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Valor da diaria invalido
        '404':
          description: Veículo não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Veiculo não encontrado
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /api/inventario/delete/{inventario_id}:
    delete:
      tags:
      - Inventário
      summary: Excluir veículo
      security:
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/InventarioId'
      responses:
        '204':
          description: Veículo excluído (resposta sem corpo)
        '400':
          description: Veículo não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Veiculo não encontrado
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /api/cliente/add:
    post:
      tags:
      - Clientes
      summary: Cadastrar cliente
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteInput'
            example:
              nome_cliente: Ruan
              sobrenome_cliente: Santos
              endereco: Rua Exemplo, 100
              cpf: '12345678900'
      responses:
        '201':
          description: Cliente cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Cliente cadastrado com sucesso
        '400':
          description: Dados do cliente inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Dados do cliente inválidos
        '409':
          description: CPF já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Cliente já cadastrado
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /api/cliente/:
    get:
      tags:
      - Clientes
      summary: Listar clientes
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cliente'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /api/cliente/{cliente_id}:
    get:
      tags:
      - Clientes
      summary: Buscar cliente por ID
      security:
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/ClienteId'
      responses:
        '200':
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteDetalhe'
        '400':
          description: Cliente não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Cliente não encontrado
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /api/cliente/update/{clientes_id}:
    put:
      tags:
      - Clientes
      summary: Atualizar cliente
      description: Atualiza os campos enviados do cliente.
      security:
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/ClientesId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteUpdate'
            example:
              nome_cliente: Ruan
              sobrenome_cliente: Santos
              endereco: Rua Nova, 200
              cpf: '12345678900'
      responses:
        '200':
          description: Cliente atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:

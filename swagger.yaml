  /api/locacoes/add:
    post:
      tags:
      - Locações
      summary: Criar locação
      description: |
        Cria uma locação. O status é definido automaticamente como ATIVA
        e o valor é calculado pelo servidor.

        Regras:
        - O cliente deve existir.
        - O veículo deve existir e ter valor de diária cadastrado.
        - O veículo não pode possuir outra locação ATIVA ou ATRASADA.
        - As datas devem estar no formato YYYY-MM-DD.
        - A data prevista de devolução deve ser posterior à data de início.
        - Valor = número de dias x valor da diária do veículo.
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocacaoInput'
            example:
              data_inicio: '2026-10-08'
              data_prevista_devolucao: '2026-10-15'
              inventario_id: 1
              clientes_id: 1
      responses:
        '201':
          description: Locação criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                  id:
                    type: integer
                example:
                  mensagem: Locação criada com sucesso
                  id: 1
        '400':
          description: Regra de negócio ou dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              examples:
                cliente:
                  value:
                    mensagem: Cliente não encontrado
                veiculo:
                  value:
                    mensagem: Veiculo não Encontrado
                data:
                  value:
                    mensagem: Formato de Data Invalido
                periodo:
                  value:
                    mensagem: Data de Devolução deve ser posterior a data de inicio
                sem_diaria:
                  value:
                    mensagem: Veiculo sem valor de diaria cadastrado
        '409':
          description: Veículo já possui uma locação ATIVA ou ATRASADA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Veiculo ja esta alugado
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /api/locacoes:
    get:
      tags:
      - Locações
      summary: Listar locações
      description: Retorna todas as locações cadastradas.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Lista de locações
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Locacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /api/locacao/{locacoes_id}:
    get:
      tags:
      - Locações
      summary: Buscar locação por ID
      security:
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/LocacaoId'
      responses:
        '200':
          description: Locação encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Locacao'
        '404':
          description: Locação não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Locação não encontrada
        '401':
          $ref: '#/components/responses/NaoAutenticado'
    patch:
      tags:
      - Locações
      summary: Atualizar status da locação
      description: |
        Altera somente o status da locação.

        Transições permitidas:
        - ATIVA -> FINALIZADA
        - ATIVA -> ATRASADA
        - ATIVA -> CANCELADA
        - ATRASADA -> FINALIZADA

        Estados FINALIZADA e CANCELADA não possuem novas transições.
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusLocacaoInput'
            example:
              status_locacao: FINALIZADA
      parameters:
      - $ref: '#/components/parameters/LocacaoId'
      responses:
        '200':
          description: Status atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Locação atualizada com sucesso
        '400':
          description: Locação não encontrada ou status inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              examples:
                nao_encontrada:
                  value:
                    mensagem: Locação não Encontrada
                status_invalido:
                  value:
                    mensagem: Status invalido
        '409':
          description: Transição de status não permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Transição de status não permitida
        '401':
          $ref: '#/components/responses/NaoAutenticado'
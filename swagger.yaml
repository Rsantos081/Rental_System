      responses:
        '201':
          description: Pagamento cadastrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                  id:
                    type: integer
              example:
                mensagem: Pagamento cadastrado com sucesso
                id: 1
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              examples:
                dados_invalidos:
                  value:
                    mensagem: Dados do pagamento invalidos
                valor:
                  value:
                    mensagem: valor de pagamento invalido
                data:
                  value:
                    mensagem: Formato de Data invalido
        '404':
          description: Locação não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                mensagem: Locação não encontrada
        '409':
          description: Regra de negócio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              examples:
                cancelada:
                  value:
                    mensagem: Locação cancelada não aceita pagamento
                excede_saldo:
                  value:
                    mensagem: Pagamento excede o saldo da locação
        '401': &id001
          $ref: '#/components/responses/NaoAutenticado'
      description: |
        Registra um pagamento de uma locação.

        Regras:
        - A locação deve existir e não pode estar CANCELADA.
        - O valor deve ser maior que zero.
        - A data deve estar no formato YYYY-MM-DD.
        - A soma dos pagamentos não pode ultrapassar o valor da locação.

